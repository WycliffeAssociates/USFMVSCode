name: PR Build & Test

on:
  pull_request:
    branches:
      - master
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
    
    strategy:
      matrix:
        node-version: [24.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Lint
      run: npm run lint -- --max-warnings 0

    - name: Compile project
      run: npm run compile

    - name: Run unit tests
      run: npm test

    # The integration tests launch a real VS Code instance, which needs a
    # display. GitHub's Linux runners are headless, so run them under a
    # virtual framebuffer (xvfb is preinstalled on ubuntu-latest).
    - name: Run integration tests
      run: xvfb-run -a npm run test:integration

    - name: Build production package
      run: npm run package
