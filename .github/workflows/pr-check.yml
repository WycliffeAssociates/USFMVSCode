name: PR Build & Test

on:
  pull_request:
    branches:
      - master
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
    
    strategy:
      matrix:
        node-version: [24.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    # `npm test` lints (--max-warnings 0), compiles the tests (tsc) and bundles
    # the extension (webpack) before running the unit tests.
    - name: Lint, compile and run unit tests
      run: npm test

    # The integration tests launch a real VS Code instance, which needs a
    # display. GitHub's Linux runners are headless, so run them under a
    # virtual framebuffer (xvfb is preinstalled on ubuntu-latest).
    # Use test:integration:run rather than test:integration, which would
    # recompile everything the previous step just built.
    - name: Run integration tests
      run: xvfb-run -a npm run test:integration:run

    - name: Build production package
      run: npm run package
